name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_VERSION: 0.1.0-alpha.${{ github.run_number }}
  RELEASE_TAG: latest

jobs:
  Package:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        # One entry for each runtime package. A failure of an entry stops the release.
        # The union job assembles the final managed packages after all platform builds finish.
        # There is no osx-x64 entry, because libclang has no runtime package for that RID.
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
            packages: '*.nupkg'
          - rid: osx-arm64
            runs_on: macos-latest
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: win-x64
            runs_on: windows-latest
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false

      # SharpCpp is consumed as a sibling checkout (SharpCppRoot defaults to ../SharpCpp).
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build p7zip-full \
            libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxss-dev libasound2-dev \
            libpulse-dev libibus-1.0-dev libdbus-1-dev libreadline6-dev \
            libudev-dev uuid-dev libtbb-dev

      # package.sh needs bash 4 or later.
      - name: Install Dependencies
        if: runner.os == 'macOS'
        run: brew install bash ninja

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Downloads the rbfx SDK from the rbfx/rbfx `latest` release, generates and builds
      # the wrappers, then packs them.
      - name: Build Packages
        timeout-minutes: 60
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          ./packaging/nuget/package.sh create \
            --version "$PACKAGE_VERSION" \
            --rid '${{ matrix.rid }}' \
            --configuration Release

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/package/nuget/out/${{ matrix.packages }}
          if-no-files-found: error

      - name: Upload API Manifest
        uses: actions/upload-artifact@v7
        with:
          name: api-manifest-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/native/*/generated/rbfx/ApiManifest.tsv
          if-no-files-found: error

      # The managed assembly of this platform. A later job reads the public API of each
      # platform assembly and builds the union reference assembly.
      - name: Upload Managed Assembly
        uses: actions/upload-artifact@v7
        with:
          name: managed-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/bin/Release/SharpCpp.Rbfx.Bindings.dll
          if-no-files-found: error

      - name: Upload Managed Package Inputs
        uses: actions/upload-artifact@v7
        with:
          name: package-input-${{ matrix.rid }}
          path: |
            SharpCpp.Rbfx/build/package/nuget/stage/managed/lib/
            SharpCpp.Rbfx/build/package/nuget/stage/managed/analyzers/
          if-no-files-found: error

      # The generated C# and C++ sources and the generator logs, for debugging.
      - name: Upload Generated Sources
        uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/native/*/generated/
          if-no-files-found: error

  Union:
    name: Union API and Packages
    needs: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Platform Inputs
        uses: actions/download-artifact@v8
        with:
          path: SharpCpp.Rbfx/build/union-input
      - name: Install rbfx Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglx0 libx11-6 libdbus-1-3 libuuid1
      - name: Test Union Generator
        run: dotnet test SharpCpp/tests/SharpCpp.Tests.ApiUnion/SharpCpp.Tests.ApiUnion.csproj -c Release --nologo
      - name: Build Union Packages
        working-directory: SharpCpp.Rbfx
        run: dotnet run --file packaging/nuget/UnionPackage.cs -- create --input build/union-input --version "$PACKAGE_VERSION"
      - name: Upload Union Packages
        uses: actions/upload-artifact@v7
        with:
          name: union-nuget
          path: SharpCpp.Rbfx/build/package/union/packages/*.nupkg
          if-no-files-found: error
      - name: Upload Union Sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: union-sources
          path: |
            SharpCpp.Rbfx/build/package/union/sources/Reference.g.cs
            SharpCpp.Rbfx/build/package/union/sources/Aliases.tsv
            SharpCpp.Rbfx/build/package/union/sources/*/Stubs.g.cs
          if-no-files-found: warn

  Smoke:
    name: Union Runtime (${{ matrix.rid }})
    needs: Union
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
          - rid: osx-arm64
            runs_on: macos-latest
          - rid: win-x64
            runs_on: windows-latest
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Union Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: SharpCpp.Rbfx/build/union-smoke/packages
      - name: Install rbfx Runtime Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglx0 libx11-6 libdbus-1-3 libuuid1
      - name: Verify Union Runtime
        working-directory: SharpCpp.Rbfx
        run: >-
          dotnet run --file packaging/nuget/UnionPackage.cs -- smoke
          --packages build/union-smoke/packages --version "${{ env.PACKAGE_VERSION }}" --framework net10.0
          --platform linux-x64 --platform osx-arm64 --platform win-x64

  Release-Latest:
    name: Release Latest
    needs: [Union, Smoke]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: packages
          merge-multiple: true

      # A git push of the tag fails when the tagged commit changes a workflow file, because the
      # workflow token has no `workflows` permission. The references API has no such check.
      - name: Move Tag
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Release Packages
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --title "Latest Build" \
              --notes "Rolling build of the latest commit on master."
          fi
          # Package file names contain the version, so remove the packages of the previous build.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          gh release upload "$RELEASE_TAG" packages/*.nupkg --clobber
