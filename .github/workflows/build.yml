name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PACKAGE_VERSION: 0.1.0-alpha.${{ github.run_number }}
  RELEASE_TAG: latest

jobs:
  Package:
    name: ${{ matrix.rid }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        # One entry for each runtime package. A failure of an entry stops the release.
        # The union job assembles the final managed packages after all platform builds finish.
        # There is no osx-x64 entry, because libclang has no runtime package for that RID.
        # The xUnit E2E suite runs on desktop hosts; platform examples still build for mobile, web and UWP.
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
            packages: '*.nupkg'
            e2e: true
          - rid: osx-arm64
            runs_on: macos-latest
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
            e2e: true
          - rid: win-x64
            runs_on: windows-latest
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
            e2e: true
          - rid: uap-x64
            runs_on: windows-2022
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: android-arm
            runs_on: ubuntu-latest
            cross: true
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: android-arm64
            runs_on: ubuntu-latest
            cross: true
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: android-x64
            runs_on: ubuntu-latest
            cross: true
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: ios-arm64
            runs_on: macos-latest
            cross: true
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: browser-wasm
            runs_on: ubuntu-latest
            cross: true
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false

      # SharpCpp is consumed as a sibling checkout (SharpCppRoot defaults to ../SharpCpp).
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build p7zip-full \
            libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxss-dev libasound2-dev \
            libpulse-dev libibus-1.0-dev libdbus-1-dev libreadline6-dev \
            libudev-dev uuid-dev libtbb-dev

      # package.sh needs bash 4 or later.
      - name: Install Dependencies
        if: runner.os == 'macOS'
        run: brew install bash ninja

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Android NDK
        if: startsWith(matrix.rid, 'android-')
        shell: bash
        run: |
          rbfx_android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          rbfx_sdkmanager_path="$(find -L "$rbfx_android_sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$rbfx_sdkmanager_path"
          "$rbfx_sdkmanager_path" --install 'ndk;27.2.12479018'
          rbfx_ndk_path="$rbfx_android_sdk_root/ndk/27.2.12479018"
          test -f "$rbfx_ndk_path/build/cmake/android.toolchain.cmake"
          echo "ANDROID_NDK_HOME=$rbfx_ndk_path" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$rbfx_ndk_path" >> "$GITHUB_ENV"

      - name: Setup Emscripten
        if: matrix.rid == 'browser-wasm'
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install 3.1.56
          ./emsdk/emsdk activate 3.1.56
          echo "EMSDK=$GITHUB_WORKSPACE/emsdk" >> "$GITHUB_ENV"

      # Downloads or builds the matching rbfx SDK, generates and builds the wrappers, then packs them.
      - name: Build Packages
        if: matrix.cross != true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          cmake_args=()
          if [[ '${{ matrix.rid }}' == 'uap-x64' ]]; then
            cmake_args+=(--preset uap-x64)
          fi
          ./packaging/nuget/package.sh create \
            --version "$PACKAGE_VERSION" \
            --rid '${{ matrix.rid }}' \
            "${cmake_args[@]}" \
            --configuration Release

      - name: Run E2E tests
        if: matrix.e2e == true
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          sdk_root="$(./eng/fetch-rbfx-sdk.sh --rid '${{ matrix.rid }}' --print-root)"
          if command -v cygpath >/dev/null 2>&1; then
            sdk_root="$(cygpath -m "$sdk_root")"
          fi
          test -f "$sdk_root/share/Urho3D/CMake/Urho3DConfig.cmake"
          mkdir -p build/test-results/e2e
          RBFX_SDK_ROOT="$sdk_root" dotnet test \
            SharpCpp.Rbfx.Tests.E2E/SharpCpp.Rbfx.Tests.E2E.csproj \
            --configuration Release \
            --nologo \
            --logger 'trx;LogFileName=SharpCpp.Rbfx.Tests.E2E.trx' \
            --results-directory build/test-results/e2e \
            -p:RbfxNativePreset=dev \
            -p:RbfxTargetRid='${{ matrix.rid }}'

      - name: Upload E2E test results
        if: always() && matrix.e2e == true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/test-results/e2e/*.trx
          if-no-files-found: ignore

      - name: Build Cross-platform Packages
        if: matrix.cross == true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: >-
          dotnet run --file packaging/nuget/CrossPackage.cs -- create
          --version "$PACKAGE_VERSION" --rid '${{ matrix.rid }}' --build-root build

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/package/nuget/out/${{ matrix.packages }}
          if-no-files-found: error

      # The managed assembly of this platform. A later job reads the public API of each
      # platform assembly and builds the union reference assembly.
      - name: Upload Managed Assembly
        uses: actions/upload-artifact@v7
        with:
          name: managed-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/bin/Release/SharpCpp.Rbfx.Bindings.dll
          if-no-files-found: error

      - name: Upload Managed Package Inputs
        uses: actions/upload-artifact@v7
        with:
          name: package-input-${{ matrix.rid }}
          path: |
            SharpCpp.Rbfx/build/package/nuget/stage/managed/lib/
            SharpCpp.Rbfx/build/package/nuget/stage/managed/analyzers/
          if-no-files-found: error

      # The generated C# and C++ sources and the generator logs, for debugging.
      - name: Upload Generated Sources
        uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/native/*/generated/
          if-no-files-found: error

  Union:
    name: Union API and Packages
    needs: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Wasm Tools Workload
        run: dotnet workload install wasm-tools
      - name: Download Platform Inputs
        uses: actions/download-artifact@v8
        with:
          path: SharpCpp.Rbfx/build/union-input
      - name: Install rbfx Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglx0 libx11-6 libdbus-1-3 libuuid1
      - name: Test Union Generator
        run: dotnet test SharpCpp/tests/SharpCpp.Tests.ApiUnion/SharpCpp.Tests.ApiUnion.csproj -c Release --nologo
      - name: Build Union Packages
        working-directory: SharpCpp.Rbfx
        run: dotnet run --file packaging/nuget/UnionPackage.cs -- create --input build/union-input --version "$PACKAGE_VERSION"
      - name: Upload Union Packages
        uses: actions/upload-artifact@v7
        with:
          name: union-nuget
          path: SharpCpp.Rbfx/build/package/union/packages/*.nupkg
          if-no-files-found: error
      - name: Upload Union Sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: union-sources
          path: |
            SharpCpp.Rbfx/build/package/union/sources/Reference.g.cs
            SharpCpp.Rbfx/build/package/union/sources/Aliases.tsv
            SharpCpp.Rbfx/build/package/union/sources/*/Stubs.g.cs
          if-no-files-found: warn

  Smoke:
    name: Union Runtime (${{ matrix.rid }})
    needs: Union
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
          - rid: osx-arm64
            runs_on: macos-latest
          - rid: win-x64
            runs_on: windows-latest
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Union Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: SharpCpp.Rbfx/build/union-smoke/packages
      - name: Install rbfx Runtime Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglx0 libx11-6 libdbus-1-3 libuuid1
      - name: Verify Union Runtime
        working-directory: SharpCpp.Rbfx
        run: >-
          dotnet run --file packaging/nuget/UnionPackage.cs -- smoke
          --packages build/union-smoke/packages --version "${{ env.PACKAGE_VERSION }}" --framework net10.0
          --platform linux-x64 --platform osx-arm64 --platform win-x64

  Cross-Consumer:
    name: Example Build (${{ matrix.rid }})
    needs: Union
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-latest
            project: Rbfx.Examples/Example.Desktop/Example.Desktop.csproj
          - rid: osx-arm64
            runs_on: macos-latest
            project: Rbfx.Examples/Example.Desktop/Example.Desktop.csproj
          - rid: win-x64
            runs_on: windows-latest
            project: Rbfx.Examples/Example.Desktop/Example.Desktop.csproj
          - rid: android-arm
            workload: android
            runs_on: ubuntu-latest
            project: Rbfx.Examples/Example.Android/Example.Android.csproj
            verify: true
          - rid: android-arm64
            workload: android
            runs_on: ubuntu-latest
            project: Rbfx.Examples/Example.Android/Example.Android.csproj
            verify: true
          - rid: android-x64
            workload: android
            runs_on: ubuntu-latest
            project: Rbfx.Examples/Example.Android/Example.Android.csproj
            verify: true
          - rid: ios-arm64
            workload: ios
            runs_on: macos-latest
            project: Rbfx.Examples/Example.Ios/Example.Ios.csproj
            verify: true
          - rid: browser-wasm
            workload: wasm-tools
            runs_on: ubuntu-latest
            project: Rbfx.Examples/Example.Wasm/Example.Wasm.csproj
            verify: true
          - rid: uap-x64
            runs_on: windows-latest
            project: Rbfx.Examples/Example.Uwp/Example.Uwp.csproj
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Install Platform Workload
        if: matrix.workload != ''
        run: dotnet workload install ${{ matrix.workload }} --version 10.0.401
      - name: Download Union Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: SharpCpp.Rbfx/build/cross-packages
      - name: Build Native Package Consumer
        if: matrix.verify == true
        working-directory: SharpCpp.Rbfx
        run: >-
          dotnet run --file packaging/nuget/CrossPackage.cs -- verify
          --rid '${{ matrix.rid }}' --version "$PACKAGE_VERSION" --packages build/cross-packages
      - name: Restore Example
        working-directory: SharpCpp.Rbfx
        shell: bash
        run: |
          cat > build/NuGet.Config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="ci-union" value="cross-packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
          dotnet restore '${{ matrix.project }}' --configfile build/NuGet.Config -p:RbfxPackageVersion="$PACKAGE_VERSION" -p:RuntimeIdentifier='${{ matrix.rid }}' -p:RbfxExamplesNuGetOnly=true
      - name: Build Example
        if: matrix.rid != 'uap-x64'
        working-directory: SharpCpp.Rbfx
        shell: bash
        run: >-
          dotnet build '${{ matrix.project }}' --configuration Release --no-restore --nologo
          -p:RbfxPackageVersion="$PACKAGE_VERSION"
          -p:RuntimeIdentifier='${{ matrix.rid }}'
          -p:RbfxExamplesNuGetOnly=true
          -p:EnableCodeSigning=false -p:BuildIpa=false
      - name: Build UWP Example
        if: matrix.rid == 'uap-x64'
        working-directory: SharpCpp.Rbfx
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Workload.Universal -property installationPath
          if (-not $vsPath) { throw 'Visual Studio with the Universal Windows Platform workload was not found.' }

          $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\MSBuild.exe'
          $project = 'Rbfx.Examples/Example.Uwp/Example.Uwp.csproj'
          $arguments = @(
            $project,
            '/t:Build',
            '/nologo',
            '/p:Configuration=Release',
            "/p:RbfxPackageVersion=$env:PACKAGE_VERSION",
            '/p:RuntimeIdentifier=uap-x64',
            '/p:RbfxExamplesNuGetOnly=true',
            '/p:EnableCodeSigning=false',
            '/p:BuildIpa=false'
          )
          & $msbuild @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Consumer Build Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/cross-consumer/${{ matrix.rid }}/obj/**/*.log
          if-no-files-found: warn

  Publish-NuGet:
    name: Publish NuGet Packages
    needs: [Union, Smoke, Cross-Consumer]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: packages

      - name: NuGet Login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: rokups

      - name: Publish Packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  Release-Latest:
    name: Release Latest
    needs: [Union, Smoke, Cross-Consumer]
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    concurrency:
      group: rbfx-sharpcpp-latest-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: packages
          merge-multiple: true

      # GITHUB_TOKEN cannot update the tag when the target commit changes a workflow file.
      # Keep refreshing release assets even when that tag update is denied.
      - name: Move Tag
        continue-on-error: true
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Release Packages
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --title "Latest Build" \
              --notes "Rolling build of the latest commit on master."
          fi
          # Package file names contain the version, so remove only old packages and preserve the Wasm SDK cache.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith(".nupkg"))' | while read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          gh release upload "$RELEASE_TAG" packages/*.nupkg --clobber
