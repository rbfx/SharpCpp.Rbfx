name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RELEASE_TAG: latest

jobs:
  Version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      # Tag v1.2.3 builds version 1.2.3.
      # Other builds use the next patch version of the last v* tag: 1.2.4-dev.g<short commit id>.
      - name: Compute Version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            last="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
            core="${last#v}"
            core="${core%%-*}"
            IFS=. read -r major minor patch <<< "$core"
            version="$major.$minor.$((patch + 1))-dev.g${GITHUB_SHA::7}"
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  Package:
    name: ${{ matrix.rid }}
    needs: Version
    runs-on: ${{ matrix.runs_on }}
    env:
      PACKAGE_VERSION: ${{ needs.Version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # One entry for each runtime package. A failure of an entry stops the release.
        # The union job assembles the final managed packages after all platform builds finish.
        # There is no osx-x64 entry, because libclang has no runtime package for that RID.
        # An entry with sdk_tag also builds the SDK archive. The tag is the platform tag of the archive.
        # It is also the name of the CMake preset of the RID. uap-x64, ios-arm64 and browser-wasm have no SDK archive.
        # An Android entry packs the SDK from the native tree of its cross package build.
        # The generators run on the host. The SDK of an Android entry is built and checked, and never runs.
        include:
          - rid: linux-x64
            runs_on: ubuntu-24.04
            sdk_tag: linux-gcc-x64-dll
            packages: '*.nupkg'
          - rid: osx-arm64
            runs_on: macos-latest
            sdk_tag: macos-clang-arm64-dll
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: win-x64
            runs_on: windows-latest
            sdk_tag: windows-msvc-x64-dll
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: uap-x64
            runs_on: windows-2022
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: android-arm
            runs_on: ubuntu-24.04
            cross: true
            sdk_tag: android-clang-arm-dll
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: android-arm64
            runs_on: ubuntu-24.04
            cross: true
            sdk_tag: android-clang-arm64-dll
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: android-x64
            runs_on: ubuntu-24.04
            cross: true
            sdk_tag: android-clang-x64-dll
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: ios-arm64
            runs_on: macos-latest
            cross: true
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
          - rid: browser-wasm
            runs_on: ubuntu-24.04
            cross: true
            packages: 'SharpCpp.Rbfx.Bindings.runtime.*.nupkg'
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false

      # SharpCpp is consumed as a sibling checkout (SharpCppRoot defaults to ../SharpCpp).
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Native Toolchain
        uses: ./SharpCpp.Rbfx/.github/actions/native-toolchain
        with:
          rid: ${{ matrix.rid }}

      # Downloads or builds the matching rbfx SDK, generates and builds the wrappers, then packs them.
      - name: Build Packages
        if: matrix.cross != true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          ./packaging/nuget/package.sh create \
            --version "$PACKAGE_VERSION" \
            --rid '${{ matrix.rid }}' \
            --configuration Release

      - name: Build Cross-platform Packages
        if: matrix.cross == true
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: >-
          dotnet run --file packaging/nuget/CrossPackage.cs -- create
          --version "$PACKAGE_VERSION" --rid '${{ matrix.rid }}'


      - name: Ensure 7z
        if: matrix.sdk_tag != ''
        uses: ./SharpCpp.Rbfx/.github/actions/ensure-7z

      # The SDK needs the managed output of the generators in the build root of the package build.
      # Build the user-code generator now. The native tree stays as it is, because a MSBuild
      # build of the native project would configure it again.
      - name: Build SDK Managed Output
        if: matrix.sdk_tag != ''
        timeout-minutes: 30
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          build_root="$PWD/build/package/nuget/${{ matrix.rid }}/build"
          if command -v cygpath >/dev/null 2>&1; then
            build_root="$(cygpath -m "$build_root")"
          fi
          paths_props="$PWD/eng/SharpCpp.Rbfx.Deterministic.props"
          if command -v cygpath >/dev/null 2>&1; then
            paths_props="$(cygpath -m "$paths_props")"
          fi
          dotnet build Rbfx.UserCode.Generator/Rbfx.UserCode.Generator.csproj \
            --configuration Release \
            --nologo \
            -p:RbfxPackaging=true \
            -p:CustomAfterMicrosoftCommonProps="$paths_props" \
            -p:RbfxTargetRid='${{ matrix.rid }}' \
            -p:SharpCppBuildRoot="$build_root"
          # The SDK has the assembly that attaches the managed side to the native host.
          dotnet build SharpCpp.Rbfx.NativeHost/SharpCpp.Rbfx.NativeHost.csproj \
            --configuration Release \
            --nologo \
            -p:RbfxPackaging=true \
            -p:CustomAfterMicrosoftCommonProps="$paths_props" \
            -p:RbfxTargetRid='${{ matrix.rid }}' \
            -p:SharpCppBuildRoot="$build_root"

      # The SDK host library must not contain the dotnet root of the runner.
      # The configure step keeps the other cache values of the package build.
      - name: Build SDK Host
        if: matrix.sdk_tag != ''
        timeout-minutes: 60
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          native_dir="build/package/nuget/${{ matrix.rid }}/build/native/${{ matrix.sdk_tag }}"
          test -f "$native_dir/CMakeCache.txt"
          cmake -B "$native_dir" -DRBFX_HOST_DEFAULT_DOTNET_ROOT=OFF
          cmake --build "$native_dir" --config Release --target sharpcpp-rbfx-host

      - name: Pack SDK
        if: matrix.sdk_tag != ''
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          ./packaging/sdk/pack-sdk.sh \
            --build-dir "build/package/nuget/${{ matrix.rid }}/build/native/${{ matrix.sdk_tag }}" \
            --config Release \
            --tag '${{ matrix.sdk_tag }}' \
            --out build/package/sdk/${{ matrix.rid }}


      - name: Upload SDK Archive
        if: matrix.sdk_tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/package/sdk/${{ matrix.rid }}/*.7z
          if-no-files-found: error

      - name: Upload Packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/package/nuget/${{ matrix.rid }}/out/${{ matrix.packages }}
          if-no-files-found: error

      # The managed assembly of this platform. A later job reads the public API of each
      # platform assembly and builds the union reference assembly.
      - name: Upload Managed Assembly
        uses: actions/upload-artifact@v7
        with:
          name: managed-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/package/nuget/${{ matrix.rid }}/build/bin/Release/SharpCpp.Rbfx.Bindings.dll
          if-no-files-found: error

      - name: Upload Managed Package Inputs
        uses: actions/upload-artifact@v7
        with:
          name: package-input-${{ matrix.rid }}
          path: |
            SharpCpp.Rbfx/build/package/nuget/${{ matrix.rid }}/stage/managed/lib/
            SharpCpp.Rbfx/build/package/nuget/${{ matrix.rid }}/stage/managed/analyzers/
          if-no-files-found: error

      # The generated C# and C++ sources and the generator logs, for debugging.
      - name: Upload Generated Sources
        uses: actions/upload-artifact@v7
        with:
          name: generated-${{ matrix.rid }}
          path: |
            SharpCpp.Rbfx/build/package/nuget/${{ matrix.rid }}/build/native/*/generated/
          if-no-files-found: error

  E2E:
    name: E2E (${{ matrix.rid }})
    needs: [Version]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        # The xUnit E2E suite runs on desktop hosts only.
        # This job does not block the union job. The release jobs wait for it.
        include:
          - rid: linux-x64
            runs_on: ubuntu-24.04
          - rid: osx-arm64
            runs_on: macos-latest
          - rid: win-x64
            runs_on: windows-latest
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false

      # SharpCpp is consumed as a sibling checkout (SharpCppRoot defaults to ../SharpCpp).
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Native Toolchain
        uses: ./SharpCpp.Rbfx/.github/actions/native-toolchain
        with:
          rid: ${{ matrix.rid }}

      - name: Run E2E tests
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          sdk_root="$(./eng/fetch-rbfx-sdk.sh --rid '${{ matrix.rid }}' --print-root)"
          if command -v cygpath >/dev/null 2>&1; then
            sdk_root="$(cygpath -m "$sdk_root")"
          fi
          test -f "$sdk_root/share/Urho3D/CMake/Urho3DConfig.cmake"
          mkdir -p build/test-results/e2e
          CMAKE_PREFIX_PATH="$sdk_root" dotnet test \
            SharpCpp.Rbfx.Tests.E2E/SharpCpp.Rbfx.Tests.E2E.csproj \
            --configuration Release \
            --nologo \
            --logger 'trx;LogFileName=SharpCpp.Rbfx.Tests.E2E.trx' \
            --results-directory build/test-results/e2e \
            -p:RbfxTargetRid='${{ matrix.rid }}'

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/test-results/e2e/*.trx
          if-no-files-found: ignore

  # The union packages come from three jobs. Union Reference builds the union API and the
  # reference assembly. Union Implementation builds, checks and packs one RID in each entry.
  # Union validates all RIDs and makes the final packages. The jobs use the same paths below
  # build/package/union, so the packages are the same as from one UnionPackage.cs create run.
  Union-Test:
    name: Union Generator Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Test Union Generator
        run: dotnet test SharpCpp/tests/SharpCpp.Tests.ApiUnion/SharpCpp.Tests.ApiUnion.csproj -c Release --nologo

  Union-Reference:
    name: Union Reference
    needs: [Package]
    runs-on: ubuntu-24.04
    outputs:
      platforms: ${{ steps.reference.outputs.platforms }}
      sharpcpp: ${{ steps.reference.outputs.sharpcpp }}
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Managed Assemblies
        uses: actions/download-artifact@v8
        with:
          pattern: managed-*
          path: SharpCpp.Rbfx/build/union-input
      - name: Download Managed Package Inputs
        uses: actions/download-artifact@v8
        with:
          pattern: package-input-*
          path: SharpCpp.Rbfx/build/union-input
      # The RID list and the SharpCpp commit go to the later union jobs.
      - name: Build Union Reference
        id: reference
        working-directory: SharpCpp.Rbfx
        run: |
          dotnet run --file packaging/nuget/UnionPackage.cs -- reference --input build/union-input
          echo "platforms=$(jq -c .Platforms build/package/union/state.json)" >> "$GITHUB_OUTPUT"
          echo "sharpcpp=$(git -C ../SharpCpp rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upload Union Reference
        uses: actions/upload-artifact@v7
        with:
          name: union-reference
          path: |
            SharpCpp.Rbfx/build/package/union/state.json
            SharpCpp.Rbfx/build/package/union/dependencies/
            SharpCpp.Rbfx/build/package/union/analyzer/
            SharpCpp.Rbfx/build/package/union/reference/
            SharpCpp.Rbfx/build/package/union/sources/
            !SharpCpp.Rbfx/build/package/union/sources/obj/**
            !SharpCpp.Rbfx/build/package/union/sources/output/**
          if-no-files-found: error
      - name: Upload Union Sources
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: union-sources
          path: |
            SharpCpp.Rbfx/build/package/union/sources/Reference.g.cs
            SharpCpp.Rbfx/build/package/union/sources/Aliases.tsv
          if-no-files-found: warn

  Union-Implementation:
    name: Union Implementation (${{ matrix.rid }})
    needs: [Union-Reference, Version]
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VERSION: ${{ needs.Version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        rid: ${{ fromJSON(needs.Union-Reference.outputs.platforms) }}
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          ref: ${{ needs.Union-Reference.outputs.sharpcpp }}
          path: SharpCpp
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Union Reference
        uses: actions/download-artifact@v8
        with:
          name: union-reference
          path: SharpCpp.Rbfx/build/package/union
      - name: Download Generated Sources
        uses: actions/download-artifact@v8
        with:
          name: generated-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/union-input/generated-${{ matrix.rid }}
      - name: Download Native Packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/union-input/nuget-${{ matrix.rid }}
      - name: Build Union Implementation
        working-directory: SharpCpp.Rbfx
        run: >-
          dotnet run --file packaging/nuget/UnionPackage.cs -- implement --input build/union-input
          --version "$PACKAGE_VERSION" --rid '${{ matrix.rid }}'
      - name: Upload Union Stubs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: union-sources-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/package/union/sources/${{ matrix.rid }}/Stubs.g.cs
          if-no-files-found: warn
      # android-x64 and linux-x64 have no package here. The Union job packs them as one group.
      - name: Upload Union Implementation
        uses: actions/upload-artifact@v7
        with:
          name: union-impl-${{ matrix.rid }}
          path: |
            SharpCpp.Rbfx/build/package/union/sources/${{ matrix.rid }}/output/SharpCpp.Rbfx.Bindings.dll
            SharpCpp.Rbfx/build/package/union/stage/runtime/${{ matrix.rid }}/
            SharpCpp.Rbfx/build/package/union/packages/*.nupkg
          if-no-files-found: error

  Union:
    name: Union API and Packages
    needs: [Union-Reference, Union-Implementation, Union-Test, Version]
    runs-on: ubuntu-24.04
    env:
      PACKAGE_VERSION: ${{ needs.Version.outputs.version }}
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          ref: ${{ needs.Union-Reference.outputs.sharpcpp }}
          path: SharpCpp
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install Wasm Tools Workload
        run: dotnet workload install wasm-tools
      - name: Download Union Reference
        uses: actions/download-artifact@v8
        with:
          name: union-reference
          path: SharpCpp.Rbfx/build/package/union
      - name: Download Union Implementations
        uses: actions/download-artifact@v8
        with:
          pattern: union-impl-*
          merge-multiple: true
          path: SharpCpp.Rbfx/build/package/union
      # The data packages come from the platform packages.
      - name: Download Platform Packages
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-*
          path: SharpCpp.Rbfx/build/union-input
      - name: Install rbfx Runtime Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglx0 libx11-6 libdbus-1-3 libuuid1
      - name: Build Union Packages
        working-directory: SharpCpp.Rbfx
        run: dotnet run --file packaging/nuget/UnionPackage.cs -- pack --input build/union-input --version "$PACKAGE_VERSION"
      - name: Upload Union Packages
        uses: actions/upload-artifact@v7
        with:
          name: union-nuget
          path: SharpCpp.Rbfx/build/package/union/packages/*.nupkg
          if-no-files-found: error

  Smoke:
    name: Union Runtime (${{ matrix.rid }})
    needs: [Union, Version]
    runs-on: ${{ matrix.runs_on }}
    env:
      PACKAGE_VERSION: ${{ needs.Version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-24.04
          - rid: osx-arm64
            runs_on: macos-latest
          - rid: win-x64
            runs_on: windows-latest
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download Union Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: SharpCpp.Rbfx/build/union-smoke/packages
      - name: Install rbfx Runtime Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopengl0 libglx0 libx11-6 libdbus-1-3 libuuid1
      - name: Verify Union Runtime
        working-directory: SharpCpp.Rbfx
        run: >-
          dotnet run --file packaging/nuget/UnionPackage.cs -- smoke
          --packages build/union-smoke/packages --version "${{ env.PACKAGE_VERSION }}" --framework net10.0
          --platform linux-x64 --platform osx-arm64 --platform win-x64

  Cross-Consumer:
    name: Example Build (${{ matrix.rid }})
    needs: [Union, Version]
    runs-on: ${{ matrix.runs_on }}
    env:
      PACKAGE_VERSION: ${{ needs.Version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runs_on: ubuntu-24.04
            project: Rbfx.Examples/Example.Desktop/Example.Desktop.csproj
          - rid: osx-arm64
            runs_on: macos-latest
            project: Rbfx.Examples/Example.Desktop/Example.Desktop.csproj
          - rid: win-x64
            runs_on: windows-latest
            project: Rbfx.Examples/Example.Desktop/Example.Desktop.csproj
          - rid: android-arm
            workload: android
            runs_on: ubuntu-24.04
            project: Rbfx.Examples/Example.Android/Example.Android.csproj
            verify: true
          - rid: android-arm64
            workload: android
            runs_on: ubuntu-24.04
            project: Rbfx.Examples/Example.Android/Example.Android.csproj
            verify: true
          - rid: android-x64
            workload: android
            runs_on: ubuntu-24.04
            project: Rbfx.Examples/Example.Android/Example.Android.csproj
            verify: true
          - rid: ios-arm64
            workload: ios
            runs_on: macos-latest
            project: Rbfx.Examples/Example.Ios/Example.Ios.csproj
            verify: true
          - rid: browser-wasm
            workload: wasm-tools
            runs_on: ubuntu-24.04
            project: Rbfx.Examples/Example.Wasm/Example.Wasm.csproj
            verify: true
          - rid: uap-x64
            runs_on: windows-2022
            project: Rbfx.Examples/Example.Uwp/Example.Uwp.csproj
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false
      # SharpCpp is consumed as a sibling checkout (SharpCppRoot defaults to ../SharpCpp).
      # The build of the user library runs the generators of SharpCpp.
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Install Native Toolchain
        uses: ./SharpCpp.Rbfx/.github/actions/native-toolchain
        with:
          rid: ${{ matrix.rid }}
      - name: Install Platform Workload
        if: matrix.workload != ''
        run: dotnet workload install ${{ matrix.workload }} --version 10.0.401
      - name: Download Union Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: SharpCpp.Rbfx/build/cross-packages
      # The build of the user library needs the rbfx SDK of the RID in build/sdk/<rid>.
      - name: Get rbfx SDK Cache Key
        id: sdk-key
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          key="$(./eng/fetch-rbfx-sdk.sh --rid '${{ matrix.rid }}' --print-cache-key)"
          test -n "$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Cache rbfx SDK
        uses: actions/cache@v4
        with:
          path: SharpCpp.Rbfx/build/sdk/${{ matrix.rid }}
          key: rbfx-sdk-${{ runner.os }}-${{ steps.sdk-key.outputs.key }}
      - name: Fetch rbfx SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: ./eng/fetch-rbfx-sdk.sh --rid '${{ matrix.rid }}'
      - name: Build Native Package Consumer
        if: matrix.verify == true
        working-directory: SharpCpp.Rbfx
        run: >-
          dotnet run --file packaging/nuget/CrossPackage.cs -- verify
          --rid '${{ matrix.rid }}' --version "$PACKAGE_VERSION" --packages build/cross-packages
      # The generated user bindings project restores from this file. NuGet finds the nearest
      # NuGet.Config above build/. The source path is relative to the file.
      - name: Write NuGet Config
        working-directory: SharpCpp.Rbfx
        shell: bash
        run: |
          cat > build/NuGet.Config <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="ci-union" value="cross-packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
          </configuration>
          EOF
      - name: Restore Example
        working-directory: SharpCpp.Rbfx
        shell: bash
        run: |
          # uap-x64 is no .NET RID. A global RuntimeIdentifier reaches the referenced projects,
          # which do not know it. Example.Uwp selects its own RID from RbfxTargetRid (default uap-x64).
          rid_args=()
          if [[ '${{ matrix.rid }}' != 'uap-x64' ]]; then
            rid_args+=(-p:RuntimeIdentifier='${{ matrix.rid }}')
          fi
          dotnet restore '${{ matrix.project }}' --configfile build/NuGet.Config \
            -p:RbfxBindingsPackageVersion="$PACKAGE_VERSION" \
            -p:RbfxPackageVersion="$PACKAGE_VERSION" \
            "${rid_args[@]}"
      - name: Build Example
        if: matrix.rid != 'uap-x64'
        timeout-minutes: 60
        working-directory: SharpCpp.Rbfx
        shell: bash
        run: >-
          dotnet build '${{ matrix.project }}' --configuration Release --no-restore --nologo
          -p:RbfxBindingsPackageVersion="$PACKAGE_VERSION"
          -p:RbfxPackageVersion="$PACKAGE_VERSION"
          -p:RuntimeIdentifier='${{ matrix.rid }}'
          -p:EnableCodeSigning=false -p:BuildIpa=false
      - name: Build UWP Example
        if: matrix.rid == 'uap-x64'
        timeout-minutes: 60
        working-directory: SharpCpp.Rbfx
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Workload.Universal -property installationPath
          if (-not $vsPath) { throw 'Visual Studio with the Universal Windows Platform workload was not found.' }

          $msbuild = Join-Path $vsPath 'MSBuild\Current\Bin\MSBuild.exe'
          $project = 'Rbfx.Examples/Example.Uwp/Example.Uwp.csproj'
          $arguments = @(
            $project,
            '/t:Build',
            '/nologo',
            '/p:Configuration=Release',
            "/p:RbfxBindingsPackageVersion=$env:PACKAGE_VERSION",
            "/p:RbfxPackageVersion=$env:PACKAGE_VERSION",
            '/p:EnableCodeSigning=false',
            '/p:BuildIpa=false'
          )
          & $msbuild @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Consumer Build Logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/**/obj/**/*.log
          if-no-files-found: warn

  # Builds a small C++ project against the SDK archive and the rbfx SDK of the same RID.
  SDK-Consumer:
    name: SDK Consumer (${{ matrix.rid }})
    needs: [Package]
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        # An entry with toolchain is a cross build. The consumer is built and not run.
        include:
          - rid: linux-x64
            runs_on: ubuntu-24.04
          - rid: osx-arm64
            runs_on: macos-latest
          - rid: win-x64
            runs_on: windows-latest
          - rid: android-arm
            runs_on: ubuntu-24.04
            toolchain: cmake/toolchains/android-arm.cmake
          - rid: android-arm64
            runs_on: ubuntu-24.04
            toolchain: cmake/toolchains/android-arm64.cmake
          - rid: android-x64
            runs_on: ubuntu-24.04
            toolchain: cmake/toolchains/android-x64.cmake
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Native Toolchain
        uses: ./SharpCpp.Rbfx/.github/actions/native-toolchain
        with:
          rid: ${{ matrix.rid }}

      - name: Ensure 7z
        uses: ./SharpCpp.Rbfx/.github/actions/ensure-7z

      - name: Download SDK Archive
        uses: actions/download-artifact@v8
        with:
          name: sdk-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/sdk-archive

      - name: Build Consumer
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        working-directory: SharpCpp.Rbfx
        run: |
          rbfx_root="$(./eng/fetch-rbfx-sdk.sh --rid '${{ matrix.rid }}' --print-root)"
          if command -v cygpath >/dev/null 2>&1; then
            rbfx_root="$(cygpath -m "$rbfx_root")"
          fi
          test -f "$rbfx_root/share/Urho3D/CMake/Urho3DConfig.cmake"
          archives=(build/sdk-archive/*.7z)
          test "${#archives[@]}" -eq 1
          cross_args=()
          if [[ -n '${{ matrix.toolchain }}' ]]; then
            cross_args+=(--toolchain '${{ matrix.toolchain }}' --cmake-arg -GNinja)
          fi
          ./packaging/sdk/check-consumer.sh \
            --sdk-archive "${archives[0]}" \
            --rbfx-sdk "$rbfx_root" \
            --config Release \
            --work build/sdk-consumer \
            "${cross_args[@]}"

  Sample-Matrix:
    name: Sample Matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - name: Prepare rbfx matrix
        id: prepare
        uses: rbfx/ci/.github/actions/ci-prepare-matrix@v1
        with:
          platforms: |
            linux-gcc-x64-dll
            windows-msvc-x64-dll
            macos-clang-arm64-dll

  Sample:
    name: Sample (${{ matrix.ci_job_name }})
    needs: [Package, Sample-Matrix]
    # The shared matrix names ubuntu-latest. Pin the Linux runner to an older glibc.
    runs-on: ${{ matrix.runs_on == 'ubuntu-latest' && 'ubuntu-24.04' || matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.Sample-Matrix.outputs.matrix) }}
    env:
      DOTNET_VERSION: 10.0.x
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false

      - name: Checkout Sample
        uses: actions/checkout@v5
        with:
          repository: rokups/sample-project
          path: sample-project
          submodules: recursive
          persist-credentials: false

      - name: Select Runtime Identifier
        shell: bash
        run: |
          case '${{ matrix.ci_platform_tag }}' in
            linux-*-x64-*) echo "SAMPLE_RID=linux-x64" >> "$GITHUB_ENV" ;;
            windows-*-x64-*) echo "SAMPLE_RID=win-x64" >> "$GITHUB_ENV" ;;
            macos-*-arm64-*) echo "SAMPLE_RID=osx-arm64" >> "$GITHUB_ENV" ;;
            *) echo "Unsupported platform tag: ${{ matrix.ci_platform_tag }}"; exit 1 ;;
          esac

      - name: Ensure 7z
        uses: ./SharpCpp.Rbfx/.github/actions/ensure-7z

      - name: Download SDK Archive
        uses: actions/download-artifact@v8
        with:
          name: sdk-${{ env.SAMPLE_RID }}
          path: SharpCpp.Rbfx/build/sdk-archive

      - name: Extract SDKs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rbfx_root="$(cd SharpCpp.Rbfx && ./eng/fetch-rbfx-sdk.sh --rid "$SAMPLE_RID" --print-root)"
          archives=(SharpCpp.Rbfx/build/sdk-archive/*.7z)
          test "${#archives[@]}" -eq 1
          mkdir -p sdk-extract
          sevenzip="$(command -v 7z || command -v 7zz)"
          (cd sdk-extract && "$sevenzip" x -y "../${archives[0]}" >/dev/null)
          roots=(sdk-extract/*/)
          test "${#roots[@]}" -eq 1
          sharpcpp_root="$(cd "${roots[0]}" && pwd)"
          if command -v cygpath >/dev/null 2>&1; then
            rbfx_root="$(cygpath -m "$rbfx_root")"
            sharpcpp_root="$(cygpath -m "$sharpcpp_root")"
          fi
          echo "RBFX_SDK_ROOT=$rbfx_root" >> "$GITHUB_ENV"
          echo "SHARPCPP_SDK_ROOT=$sharpcpp_root" >> "$GITHUB_ENV"

      - name: Prepare rbfx environment
        uses: rbfx/ci/.github/actions/ci-prepare-platform@v1
        with:
          profile: downstream
          cmake_prefix_path: |
            ${{ env.RBFX_SDK_ROOT }}
            ${{ env.SHARPCPP_SDK_ROOT }}

      - name: Build sample project
        timeout-minutes: 60
        uses: rbfx/ci/.github/actions/ci-build-project@v1
        with:
          project_dir: sample-project
          build_dir: sample-build/${{ matrix.ci_platform_tag }}
          cmake_cache_vars: |
            SAMPLE_PROJECT_CSHARP:BOOL=ON

  Sample-Android:
    name: Sample (${{ matrix.rid }})
    needs: [Package]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64]
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false

      - name: Checkout Sample
        uses: actions/checkout@v5
        with:
          repository: rokups/sample-project
          path: sample-project
          submodules: recursive
          persist-credentials: false

      - name: Ensure 7z
        uses: ./SharpCpp.Rbfx/.github/actions/ensure-7z

      - name: Download SDK Archive
        uses: actions/download-artifact@v8
        with:
          name: sdk-${{ matrix.rid }}
          path: SharpCpp.Rbfx/build/sdk-archive

      - name: Extract SDKs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rbfx_root="$(cd SharpCpp.Rbfx && ./eng/fetch-rbfx-sdk.sh --rid '${{ matrix.rid }}' --print-root)"
          host_root="$(cd SharpCpp.Rbfx && ./eng/fetch-rbfx-sdk.sh --rid linux-x64 --print-root)"
          archives=(SharpCpp.Rbfx/build/sdk-archive/*.7z)
          test "${#archives[@]}" -eq 1
          mkdir -p sdk-extract
          (cd sdk-extract && 7z x -y "../${archives[0]}" >/dev/null)
          roots=(sdk-extract/*/)
          test "${#roots[@]}" -eq 1
          echo "RBFX_SDK_ROOT=$rbfx_root" >> "$GITHUB_ENV"
          echo "RBFX_HOST_SDK_ROOT=$host_root" >> "$GITHUB_ENV"
          echo "SHARPCPP_SDK_ROOT=$(cd "${roots[0]}" && pwd)" >> "$GITHUB_ENV"

      - name: Prepare rbfx environment
        uses: rbfx/ci/.github/actions/ci-prepare-platform@v1
        env:
          DOTNET_VERSION: 10.0.x
        with:
          profile: downstream
          ci_platform_tag: android-clang-arm64-dll
          cmake_prefix_path: |
            ${{ env.RBFX_SDK_ROOT }}
            ${{ env.RBFX_HOST_SDK_ROOT }}
            ${{ env.SHARPCPP_SDK_ROOT }}

      - name: Install Android NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$(find -L "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager"
          "$sdkmanager" --install 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$sdk_root/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Android Workload
        shell: bash
        run: dotnet workload install android

      - name: Install PackageTool Dependencies
        shell: bash
        run: python3 -m pip install --user lz4

      - name: Build Sample
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          toolchain="$PWD/SharpCpp.Rbfx/cmake/toolchains/${{ matrix.rid }}.cmake"
          cmake -S sample-project -B sample-build -GNinja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_SHARED_LIBS=ON -DSAMPLE_PROJECT_CSHARP=ON \
            "-DCMAKE_PREFIX_PATH=$RBFX_SDK_ROOT;$RBFX_HOST_SDK_ROOT;$SHARPCPP_SDK_ROOT" \
            "-DCMAKE_FIND_ROOT_PATH=$RBFX_SDK_ROOT;$RBFX_HOST_SDK_ROOT;$SHARPCPP_SDK_ROOT"
          cmake --build sample-build

  # Builds the sample with C# hosting for Web and iOS. Neither platform has a SharpCpp.Rbfx SDK archive.
  # The build uses the source tree of SharpCpp.Rbfx (shim prefix) and the static engine SDK of the RID.
  # The shim builds the generators with dotnet itself, so the job needs no host SDK.
  Sample-Mobile:
    name: Sample (${{ matrix.rid }})
    needs: [Union]
    # First run: a failure of this job does not block Release-Latest. Remove this line when the job is stable.
    continue-on-error: true
    runs-on: ${{ matrix.runs_on }}
    env:
      DOTNET_VERSION: 10.0.401
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: browser-wasm
            runs_on: ubuntu-24.04
            workload: wasm-tools
            build_type: Release
          - rid: ios-arm64
            runs_on: macos-latest
            workload: ios
            build_type: RelWithDebInfo
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5
        with:
          path: SharpCpp.Rbfx
          persist-credentials: false

      # The shim prefix needs SharpCpp next to SharpCpp.Rbfx (SHARPCPP_ROOT defaults to ../SharpCpp).
      - name: Checkout SharpCpp
        uses: actions/checkout@v5
        with:
          repository: rokups/SharpCpp
          path: SharpCpp
          persist-credentials: false

      - name: Checkout Sample
        uses: actions/checkout@v5
        with:
          repository: rokups/sample-project
          path: sample-project
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Installs Ninja, and Emscripten 3.1.56 for browser-wasm (the version of the wasm-tools workload).
      - name: Install Native Toolchain
        uses: ./SharpCpp.Rbfx/.github/actions/native-toolchain
        with:
          rid: ${{ matrix.rid }}

      - name: Install Platform Workload
        run: dotnet workload install ${{ matrix.workload }} --version ${{ env.DOTNET_VERSION }}

      - name: Ensure 7z
        uses: ./SharpCpp.Rbfx/.github/actions/ensure-7z

      # The pak step of the sample runs PackageTool.py of the engine SDK. The script needs lz4.
      - name: Install PackageTool Dependencies
        env:
          PIP_BREAK_SYSTEM_PACKAGES: '1'
        shell: bash
        run: python3 -m pip install --user lz4

      - name: Fetch rbfx SDK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rbfx_root="$(cd SharpCpp.Rbfx && ./eng/fetch-rbfx-sdk.sh --rid '${{ matrix.rid }}' --print-root)"
          test -f "$rbfx_root/share/Urho3D/CMake/Urho3DConfig.cmake"
          echo "RBFX_SDK_ROOT=$rbfx_root" >> "$GITHUB_ENV"

      # The CMake prefix path lists the engine SDK and the source tree of SharpCpp.Rbfx.
      # The Emscripten toolchain searches packages in CMAKE_FIND_ROOT_PATH only, so the job sets both.
      - name: Build Sample
        timeout-minutes: 90
        shell: bash
        run: |
          toolchain="$PWD/SharpCpp.Rbfx/cmake/toolchains/${{ matrix.rid }}.cmake"
          source_prefix="$PWD/SharpCpp.Rbfx/cmake/SharpCppRbfx"
          cmake -S sample-project -B sample-build -GNinja -DCMAKE_BUILD_TYPE='${{ matrix.build_type }}' \
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" -DBUILD_SHARED_LIBS=OFF -DSAMPLE_PROJECT_CSHARP=ON \
            "-DCMAKE_PREFIX_PATH=$RBFX_SDK_ROOT;$source_prefix" \
            "-DCMAKE_FIND_ROOT_PATH=$RBFX_SDK_ROOT;$source_prefix"
          cmake --build sample-build

  Publish-NuGet:
    name: Publish NuGet Packages
    needs: [Union, Smoke, Cross-Consumer, E2E]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: packages

      - name: NuGet Login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: rokups

      - name: Publish Packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  Release-Latest:
    name: Release Latest
    needs: [Union, Smoke, Cross-Consumer, E2E, SDK-Consumer, Sample, Sample-Android, Sample-Mobile]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    concurrency:
      group: rbfx-sharpcpp-latest-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: packages
          merge-multiple: true

      - name: Download SDK Archives
        uses: actions/download-artifact@v8
        with:
          pattern: sdk-*
          path: sdk
          merge-multiple: true

      # GITHUB_TOKEN cannot update the tag when the target commit changes a workflow file.
      # Keep refreshing release assets even when that tag update is denied.
      - name: Move Tag
        continue-on-error: true
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" -F force=true
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA"
          fi

      - name: Release Packages
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --title "Latest Build" \
              --notes "Rolling build of the latest commit on master."
          fi
          # Package file names contain the version, so remove only old packages and preserve the Wasm SDK cache.
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(endswith(".nupkg"))' | while read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          gh release upload "$RELEASE_TAG" packages/*.nupkg --clobber

      # The archive names have no version, so --clobber replaces the old assets.
      - name: Release SDK Archives
        shell: bash
        run: gh release upload "$RELEASE_TAG" sdk/*.7z --clobber

  Release-Tag:
    name: Release Tag
    needs: [Union, Smoke, Cross-Consumer, E2E, SDK-Consumer, Version]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.Version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v8
        with:
          name: union-nuget
          path: packages
          merge-multiple: true

      - name: Download SDK Archives
        uses: actions/download-artifact@v8
        with:
          pattern: sdk-*
          path: sdk
          merge-multiple: true

      - name: Release Packages
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            case "$PACKAGE_VERSION" in
              *-*) PRERELEASE=--prerelease ;;
              *) PRERELEASE= ;;
            esac
            gh release create "$TAG" $PRERELEASE --verify-tag --title "$TAG" \
              --notes "SharpCpp.Rbfx $PACKAGE_VERSION."
          fi
          gh release upload "$TAG" packages/*.nupkg --clobber

      # The archive names have no version, so --clobber replaces the old assets.
      - name: Release SDK Archives
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" sdk/*.7z --clobber
