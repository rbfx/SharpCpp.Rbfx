name: Update Wasm SDK Cache

on:
  workflow_dispatch:

concurrency:
  group: rbfx-sharpcpp-latest-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  Update:
    name: Build and upload rbfx Wasm SDK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SharpCpp.Rbfx
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build p7zip-full

      - name: Setup Emscripten
        shell: bash
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install 3.1.56
          ./emsdk/emsdk activate 3.1.56
          echo "EMSDK=$GITHUB_WORKSPACE/emsdk" >> "$GITHUB_ENV"

      - name: Build rbfx SDK
        shell: bash
        run: |
          rm -rf build/package/nuget/wasm-sdk
          dotnet run --file packaging/nuget/CrossPackage.cs -- build-wasm-sdk \
            --emsdk-root "$EMSDK" \
            --build-root build/cross/browser-wasm-sdk

      - name: Replace the latest-release Wasm SDK cache
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: latest
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --title "Latest Build" \
              --notes "Rolling build of the latest commit on master."
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(startswith("rbfx-web-wasm-sdk-"))' | while read -r asset; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done
          gh release upload "$RELEASE_TAG" build/package/nuget/wasm-sdk/rbfx-web-wasm-sdk-*.7z
